[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/protocol",
    "crates/core",
    "crates/devices-mice",
    "crates/client",
    "crates/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/amackdev/RazerLine"
authors = ["RazerLine contributors"]

[workspace.dependencies]
hidapi = "2.6"
thiserror = "1.0"
libloading = "0.8"
