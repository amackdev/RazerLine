[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/amackdev/razer-hid-ctl"
authors = ["razer-hid-ctl contributors"]

[workspace.dependencies]
hidapi = "2.6"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
