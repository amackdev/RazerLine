<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <radialGradient id="mb_glow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#145A32" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mb_shell" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#2d2f36" />
      <stop offset="50%" stop-color="#1e2025" />
      <stop offset="100%" stop-color="#131417" />
    </linearGradient>
    <filter id="mb_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <ellipse cx="250" cy="380" rx="185" ry="235" fill="url(#mb_glow)" />

  <!-- Mamba Ergonomic Body with RGB Light Strips on sides -->
  <path d="M 170,115 C 190,90 220,115 240,125 L 260,125 C 280,115 315,85 335,110 C 355,135 362,200 360,280 C 358,360 360,450 340,520 C 320,575 285,590 250,590 C 205,590 175,570 155,515 C 138,450 138,360 142,280 C 145,200 150,135 170,115 Z" 
        fill="url(#mb_shell)" stroke="#383b44" stroke-width="1.8" />

  <!-- Dual Side RGB Light Strips -->
  <path d="M 148,220 C 145,300 145,400 160,480" fill="none" stroke="#40D180" stroke-width="3" filter="url(#mb_filter)" opacity="0.9" />
  <path d="M 352,220 C 355,300 355,400 340,480" fill="none" stroke="#40D180" stroke-width="3" filter="url(#mb_filter)" opacity="0.9" />

  <!-- Left Click -->
  <path d="M 170,115 C 190,90 220,115 240,125 L 242,270 L 145,255 C 145,200 150,135 170,115 Z" fill="#22242a" stroke="#3c3f4a" stroke-width="1.2" />

  <!-- Right Click -->
  <path d="M 260,125 C 280,115 315,85 335,110 C 355,135 362,200 355,255 L 258,270 L 258,125 Z" fill="#22242a" stroke="#3c3f4a" stroke-width="1.2" />

  <!-- Tilt Scroll Wheel -->
  <rect x="238" y="135" width="24" height="68" rx="4" fill="#141518" stroke="#40D180" stroke-width="1.4" filter="url(#mb_filter)" />
  <line x1="238" y1="148" x2="262" y2="148" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="160" x2="262" y2="160" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="172" x2="262" y2="172" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="184" x2="262" y2="184" stroke="#484d5a" stroke-width="1.5" />

  <!-- Dual DPI Buttons (DPI Up / DPI Down) -->
  <rect x="241" y="218" width="18" height="15" rx="3" fill="#25272e" stroke="#3d404b" stroke-width="1" />
  <rect x="241" y="238" width="18" height="15" rx="3" fill="#25272e" stroke="#3d404b" stroke-width="1" />

  <!-- Side Buttons (M5 Forward, M4 Back) -->
  <path d="M 142,295 L 149,295 L 149,335 L 141,335 Z" fill="#2b2d35" stroke="#454955" stroke-width="1.2" />
  <path d="M 141,345 L 149,345 L 148,390 L 140,385 Z" fill="#2b2d35" stroke="#454955" stroke-width="1.2" />

  <!-- Chroma Palm Logo -->
  <circle cx="250" cy="445" r="15" fill="none" stroke="#40D180" stroke-width="2" filter="url(#mb_filter)" />
  <circle cx="250" cy="445" r="4" fill="#40D180" />
</svg>
