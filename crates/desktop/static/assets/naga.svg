<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <radialGradient id="naga_glow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#145A32" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="naga_shell" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#2a2d34" />
      <stop offset="50%" stop-color="#1c1e23" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <filter id="naga_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <ellipse cx="250" cy="380" rx="195" ry="240" fill="url(#naga_glow)" />

  <!-- Naga Wide Ergonomic Body with Ring Finger Rest -->
  <path d="M 175,115 L 240,130 L 260,130 L 320,115 L 345,160 L 365,250 L 375,350 L 365,470 L 325,550 L 250,565 L 180,545 L 140,460 L 135,360 L 138,250 L 155,160 Z" 
        fill="url(#naga_shell)" stroke="#383b45" stroke-width="1.8" />

  <!-- Left Click -->
  <path d="M 175,115 L 240,130 L 242,270 L 142,250 L 155,160 Z" fill="#22242a" stroke="#3d404b" stroke-width="1.2" />

  <!-- Right Click -->
  <path d="M 260,130 L 320,115 L 345,160 L 345,260 L 258,270 Z" fill="#22242a" stroke="#3d404b" stroke-width="1.2" />

  <!-- Ring Finger Rest Shelf -->
  <path d="M 345,260 C 375,280 375,410 355,470" fill="none" stroke="#2f323a" stroke-width="1.5" />

  <!-- Tilt-Click Scroll Wheel -->
  <rect x="238" y="140" width="24" height="70" rx="4" fill="#141518" stroke="#40D180" stroke-width="1.4" filter="url(#naga_filter)" />
  <line x1="238" y1="152" x2="262" y2="152" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="165" x2="262" y2="165" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="178" x2="262" y2="178" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="191" x2="262" y2="191" stroke="#484d5a" stroke-width="1.5" />

  <!-- Dual DPI Buttons behind wheel -->
  <rect x="241" y="222" width="18" height="16" rx="3" fill="#25272e" stroke="#3d404b" stroke-width="1" />
  <rect x="241" y="243" width="18" height="16" rx="3" fill="#25272e" stroke="#3d404b" stroke-width="1" />

  <!-- Naga Iconic Side Grid Plate (Visible from top-left) -->
  <g transform="translate(136, 300)" stroke="#3f424e" stroke-width="1" fill="#202227">
    <rect x="0" y="0" width="14" height="20" rx="2" />
    <rect x="0" y="24" width="14" height="20" rx="2" />
    <rect x="0" y="48" width="14" height="20" rx="2" />
    <rect x="0" y="72" width="14" height="20" rx="2" />
  </g>

  <!-- Palm Logo -->
  <circle cx="250" cy="440" r="15" fill="none" stroke="#40D180" stroke-width="2" filter="url(#naga_filter)" />
  <circle cx="250" cy="440" r="4" fill="#40D180" />
</svg>
