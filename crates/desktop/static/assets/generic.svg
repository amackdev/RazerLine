<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <radialGradient id="generic_desk_glow" cx="50%" cy="55%" r="48%" fx="50%" fy="55%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#145A32" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="generic_shell" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#282a30" />
      <stop offset="50%" stop-color="#1c1d22" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <filter id="generic_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="250" cy="380" rx="180" ry="230" fill="url(#generic_desk_glow)" />

  <!-- Cable -->
  <path d="M 245,0 L 245,60 L 255,60 L 255,0 Z" fill="#18191c" stroke="#25272e" stroke-width="1" />

  <!-- Generic Ergonomic Chassis Outer -->
  <path d="M 185,90 
           L 240,115 
           L 260,115 
           L 315,90 
           L 345,150 
           L 350,250 
           L 342,350 
           L 330,460 
           L 290,545 
           L 250,560 
           L 210,545 
           L 170,460 
           L 158,350 
           L 150,250 
           L 155,150 Z" 
        fill="url(#generic_shell)" 
        stroke="#353842" 
        stroke-width="1.8" />

  <!-- Left Click -->
  <path d="M 185,90 L 240,115 L 242,260 L 152,240 L 155,150 Z" fill="#202227" stroke="#383c46" stroke-width="1.2" />

  <!-- Right Click -->
  <path d="M 258,115 L 315,90 L 345,150 L 348,240 L 258,260 Z" fill="#202227" stroke="#383c46" stroke-width="1.2" />

  <!-- Scroll Wheel -->
  <rect x="239" y="130" width="22" height="60" rx="4" fill="#16171a" stroke="#40D180" stroke-width="1.2" filter="url(#generic_glow)" />
  <line x1="239" y1="140" x2="261" y2="140" stroke="#484d5a" stroke-width="1.5" />
  <line x1="239" y1="150" x2="261" y2="150" stroke="#484d5a" stroke-width="1.5" />
  <line x1="239" y1="160" x2="261" y2="160" stroke="#484d5a" stroke-width="1.5" />
  <line x1="239" y1="170" x2="261" y2="170" stroke="#484d5a" stroke-width="1.5" />
  <line x1="239" y1="180" x2="261" y2="180" stroke="#484d5a" stroke-width="1.5" />

  <!-- DPI Button -->
  <rect x="242" y="210" width="16" height="18" rx="3" fill="#25272e" stroke="#404450" stroke-width="1" />

  <!-- Side Buttons (M4 & M5) on Left -->
  <rect x="146" y="220" width="10" height="24" rx="2" fill="#282a32" stroke="#454b58" stroke-width="1" />
  <rect x="149" y="250" width="10" height="22" rx="2" fill="#282a32" stroke="#454b58" stroke-width="1" />

  <!-- Palm Logo Circle -->
  <circle cx="250" cy="430" r="18" fill="none" stroke="#40D180" stroke-width="1.5" filter="url(#generic_glow)" />
  <circle cx="250" cy="430" r="6" fill="#40D180" />
</svg>
