<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <radialGradient id="cb_glow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#145A32" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cb_shell" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#2a2c32" />
      <stop offset="50%" stop-color="#1c1d22" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>
    <filter id="cb_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Chroma Glow -->
  <ellipse cx="250" cy="380" rx="175" ry="225" fill="url(#cb_glow)" />

  <!-- Outer Symmetrical Body with Tail Underglow -->
  <path d="M 180,120 L 240,135 L 260,135 L 320,120 L 338,180 L 340,270 L 330,360 L 325,460 L 290,535 L 250,548 L 210,535 L 175,460 L 170,360 L 160,270 L 162,180 Z" 
        fill="url(#cb_shell)" stroke="#353842" stroke-width="1.8" />

  <!-- Left Click -->
  <path d="M 180,120 L 240,135 L 242,275 L 160,265 L 162,180 Z" fill="#222429" stroke="#3b3e48" stroke-width="1.2" />

  <!-- Right Click -->
  <path d="M 260,135 L 320,120 L 338,180 L 340,265 L 258,275 Z" fill="#222429" stroke="#3b3e48" stroke-width="1.2" />

  <!-- Scroll Wheel with Chroma RGB -->
  <rect x="238" y="145" width="24" height="65" rx="4" fill="#141518" stroke="#40D180" stroke-width="1.4" filter="url(#cb_filter)" />
  <line x1="238" y1="155" x2="262" y2="155" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="167" x2="262" y2="167" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="179" x2="262" y2="179" stroke="#484d5a" stroke-width="1.5" />
  <line x1="238" y1="191" x2="262" y2="191" stroke="#484d5a" stroke-width="1.5" />

  <!-- Top DPI Button -->
  <rect x="242" y="225" width="16" height="18" rx="3" fill="#25272e" stroke="#40D180" stroke-width="1" />

  <!-- Side Buttons (M5 Forward, M4 Back) -->
  <path d="M 160,295 L 168,295 L 168,335 L 159,335 Z" fill="#2b2d35" stroke="#454955" stroke-width="1.2" />
  <path d="M 161,345 L 169,345 L 169,385 L 162,385 Z" fill="#2b2d35" stroke="#454955" stroke-width="1.2" />

  <!-- Chroma Palm Logo -->
  <circle cx="250" cy="430" r="14" fill="none" stroke="#40D180" stroke-width="2" filter="url(#cb_filter)" />
  <circle cx="250" cy="430" r="4" fill="#40D180" />

  <!-- Underglow Gradient Ribbon along rear edge -->
  <path d="M 215,530 C 235,542 265,542 285,530" fill="none" stroke="#40D180" stroke-width="3" filter="url(#cb_filter)" />
</svg>
