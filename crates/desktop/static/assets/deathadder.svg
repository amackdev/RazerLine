<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <radialGradient id="da_desk_glow" cx="50%" cy="55%" r="48%" fx="50%" fy="55%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#145A32" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="da_shell" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2d3038" />
      <stop offset="45%" stop-color="#1e2026" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <linearGradient id="da_click_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383b45" />
      <stop offset="60%" stop-color="#242730" />
      <stop offset="100%" stop-color="#16181d" />
    </linearGradient>
    <linearGradient id="da_click_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#353842" />
      <stop offset="60%" stop-color="#22242c" />
      <stop offset="100%" stop-color="#15161b" />
    </linearGradient>
    <filter id="da_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="250" cy="380" rx="190" ry="240" fill="url(#da_desk_glow)" />

  <!-- DeathAdder Ergonomic Outer Chassis (Right Hand Flare) -->
  <path d="M 160,110 
           C 180,85 220,110 240,120 
           L 260,120 
           C 285,110 325,75 350,95 
           C 370,125 375,200 370,280 
           C 365,360 368,440 348,510 
           C 330,570 295,595 250,595 
           C 200,595 165,565 148,505 
           C 132,445 130,360 132,280 
           C 135,200 142,130 160,110 Z" 
        fill="url(#da_shell)" 
        stroke="#3a3d48" 
        stroke-width="1.8" />

  <!-- Left Click (Flared Front) -->
  <path d="M 160,110 
           C 180,85 220,110 240,120 
           L 242,275 
           L 135,250 
           C 135,200 142,130 160,110 Z" 
        fill="url(#da_click_left)" 
        stroke="#424652" 
        stroke-width="1.2" />

  <!-- Right Click (Higher Arch) -->
  <path d="M 260,120 
           C 285,110 325,75 350,95 
           C 370,125 375,200 368,255 
           L 260,275 
           L 258,120 Z" 
        fill="url(#da_click_right)" 
        stroke="#424652" 
        stroke-width="1.2" />

  <!-- Scroll Wheel Well -->
  <rect x="236" y="130" width="28" height="75" rx="5" fill="#121316" stroke="#25272e" stroke-width="1" />
  
  <!-- Scroll Wheel with Chroma Ring -->
  <rect x="240" y="135" width="20" height="65" rx="4" fill="#18191c" stroke="#40D180" stroke-width="1.4" filter="url(#da_glow)" />
  <line x1="240" y1="145" x2="260" y2="145" stroke="#4d5360" stroke-width="1.5" />
  <line x1="240" y1="155" x2="260" y2="155" stroke="#4d5360" stroke-width="1.5" />
  <line x1="240" y1="165" x2="260" y2="165" stroke="#4d5360" stroke-width="1.5" />
  <line x1="240" y1="175" x2="260" y2="175" stroke="#4d5360" stroke-width="1.5" />
  <line x1="240" y1="185" x2="260" y2="185" stroke="#4d5360" stroke-width="1.5" />

  <!-- Dual DPI Buttons Behind Wheel -->
  <rect x="241" y="218" width="18" height="15" rx="3" fill="#24262d" stroke="#3d404b" stroke-width="1" />
  <rect x="241" y="238" width="18" height="15" rx="3" fill="#24262d" stroke="#3d404b" stroke-width="1" />

  <!-- Prominent Ergonomic Side Buttons (Left Side: M5 Forward, M4 Back) -->
  <path d="M 132,295 L 140,295 C 144,295 146,335 140,345 L 131,345 Z" fill="#2a2c34" stroke="#454955" stroke-width="1.2" />
  <path d="M 131,355 L 140,355 C 145,365 143,405 137,415 L 130,410 Z" fill="#2a2c34" stroke="#454955" stroke-width="1.2" />

  <!-- Razer Chroma Triple-Headed Snake Logo on Palm -->
  <g transform="translate(225, 435) scale(0.65)" filter="url(#da_glow)">
    <path d="M25,0 C38,0 48,10 48,23 C48,36 38,46 25,46 C12,46 2,36 2,23 C2,10 12,0 25,0 Z" fill="none" stroke="#40D180" stroke-width="2" />
    <path d="M25,6 C34,6 42,14 42,23 C42,32 34,40 25,40" fill="none" stroke="#40D180" stroke-width="2.5" />
    <circle cx="25" cy="23" r="4" fill="#40D180" />
  </g>
</svg>
