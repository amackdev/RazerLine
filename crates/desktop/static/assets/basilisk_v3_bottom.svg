<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <!-- 11-Zone Underglow Halo Filter / Gradients -->
    <radialGradient id="desk_glow_bottom" cx="50%" cy="52%" r="48%" fx="50%" fy="52%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1E8449" stop-opacity="0.18" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 11-Zone Chroma Underglow Rim Gradient -->
    <linearGradient id="underglow_rim_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#FF9900" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFF00" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="1.0" />
      <stop offset="80%" stop-color="#0099FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#CC00FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Base Plate Matte Texture -->
    <linearGradient id="base_chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22242a" />
      <stop offset="50%" stop-color="#18191e" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <!-- 100% Virgin Grade PTFE Glides (Sleek Off-White / Pearl Texture) -->
    <linearGradient id="ptfe_skate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f2f6" />
      <stop offset="60%" stop-color="#d4d8e0" />
      <stop offset="100%" stop-color="#b0b5c0" />
    </linearGradient>

    <filter id="led_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Ambient Desk Chroma Underglow Reflection -->
  <ellipse cx="250" cy="360" rx="195" ry="245" fill="url(#desk_glow_bottom)" />

  <!-- 2. Braided Cable at Top -->
  <g id="cable_bottom">
    <path d="M 244,0 L 244,55 L 256,55 L 256,0 Z" fill="#151619" stroke="#282a30" stroke-width="1" />
    <path d="M 238,55 L 238,82 L 262,82 L 262,55 Z" fill="#1a1b1f" stroke="#0a0a0c" stroke-width="1.5" />
  </g>

  <!-- 3. Outer Rim with 11-Zone Chroma Underglow Light Pipe Strip -->
  <g id="underglow_strip_bottom">
    <path d="M 175,95 
             L 235,125 
             L 265,125 
             L 325,110 
             L 355,160 
             L 365,245 
             L 362,350 
             L 350,470 
             L 310,550 
             L 250,572 
             L 190,550 
             L 155,475 
             L 125,410 
             L 115,335 
             L 138,240 
             L 155,165 Z" 
          fill="url(#base_chassis)" 
          stroke="url(#underglow_rim_grad)" 
          stroke-width="5" 
          stroke-linejoin="round" />
  </g>

  <!-- 4. Inner Chassis Bevel Border -->
  <path d="M 180,105 
           L 235,132 
           L 265,132 
           L 320,118 
           L 348,165 
           L 356,245 
           L 354,345 
           L 342,462 
           L 305,540 
           L 250,560 
           L 195,540 
           L 162,468 
           L 132,405 
           L 123,335 
           L 145,245 
           L 162,172 Z" 
        fill="#131417" 
        stroke="#24262d" 
        stroke-width="1.5" />

  <!-- 5. 100% PTFE Pure Glide Feet (Skates) -->
  <g id="ptfe_glides">
    <!-- Top-Left Skate -->
    <path d="M 182,118 L 225,142 L 210,185 L 170,150 Z" fill="url(#ptfe_skate)" stroke="#9ea3b0" stroke-width="0.8" rx="3" />
    <!-- Top-Right Skate -->
    <path d="M 318,128 L 275,142 L 290,185 L 330,152 Z" fill="url(#ptfe_skate)" stroke="#9ea3b0" stroke-width="0.8" rx="3" />
    <!-- Left Thumb-Wing Skate -->
    <path d="M 148,255 L 126,335 L 134,400 L 152,380 L 158,275 Z" fill="url(#ptfe_skate)" stroke="#9ea3b0" stroke-width="0.8" rx="3" />
    <!-- Rear Large Curved Arc Skate -->
    <path d="M 198,528 Q 250,555 302,528 L 308,505 Q 250,530 192,505 Z" fill="url(#ptfe_skate)" stroke="#9ea3b0" stroke-width="0.8" rx="4" />
  </g>

  <!-- 6. Regulatory Label & Optical Sensor Area -->
  <g id="sensor_and_label_bay">
    <!-- Center Dark Shield Label -->
    <path d="M 195,195 L 305,195 L 315,480 L 185,480 Z" fill="#0d0e10" stroke="#1f2127" stroke-width="1.2" rx="6" />

    <!-- Top Label Header -->
    <text x="250" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7a8090" text-anchor="middle" letter-spacing="1">RAZER</text>
    <text x="250" y="232" font-family="sans-serif" font-size="14" font-weight="900" fill="#d0d5e0" text-anchor="middle" letter-spacing="1.5">BASILISK V3</text>
    <text x="250" y="246" font-family="monospace" font-size="8" fill="#505560" text-anchor="middle">26K DPI FOCUS+ OPTICAL</text>

    <!-- Barcode simulation -->
    <line x1="205" y1="254" x2="295" y2="254" stroke="#404450" stroke-width="1" stroke-dasharray="2,1,3,1,1,2,4,2,1,3" />
    <text x="250" y="264" font-family="monospace" font-size="7" fill="#454854" text-anchor="middle">S/N: PM21WWAA01099</text>

    <!-- Focus+ 26K Optical Sensor Opening with PTFE Sensor Ring -->
    <g id="optical_sensor">
      <!-- Outer PTFE Sensor Ring -->
      <ellipse cx="250" cy="330" rx="22" ry="32" fill="url(#ptfe_skate)" stroke="#808696" stroke-width="1" />
      <!-- Sensor Well Recess -->
      <ellipse cx="250" cy="330" rx="14" ry="22" fill="#050507" stroke="#25272e" stroke-width="1.2" />
      <!-- Sensor Optical Eye Lens / Prism Aperture -->
      <rect x="246" y="322" width="8" height="16" rx="2" fill="#111216" stroke="#40D180" stroke-width="0.8" />
      <circle cx="250" cy="330" r="2.5" fill="#FF2222" opacity="0.85" filter="url(#led_glow)" />
    </g>

    <!-- Certification Badges -->
    <text x="212" y="385" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a3d46">CE</text>
    <text x="288" y="385" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a3d46">FC</text>
    <text x="250" y="405" font-family="monospace" font-size="7" fill="#404450" text-anchor="middle">MODEL NO: RZ01-0400</text>
    <text x="250" y="415" font-family="monospace" font-size="7" fill="#404450" text-anchor="middle">5V = 400mA • MADE IN CHINA</text>
  </g>

  <!-- 7. Hardware Profile Switch Button & Dedicated Profile Indicator LED -->
  <g id="profile_switch_assembly">
    <!-- Recessed Bevel Frame -->
    <rect x="220" y="432" width="60" height="28" rx="5" fill="#16181d" stroke="#2e323c" stroke-width="1.2" />
    
    <!-- Profile Button Plunger -->
    <rect x="223" y="435" width="34" height="22" rx="3.5" fill="#252830" stroke="#454b58" stroke-width="1" />
    <text x="240" y="449" font-family="sans-serif" font-size="8" font-weight="bold" fill="#a0a6b5" text-anchor="middle">PROFILE</text>

    <!-- Dedicated Multi-Color Profile Status LED -->
    <circle cx="268" cy="446" r="4.5" fill="#40D180" stroke="#80FFB0" stroke-width="1" filter="url(#led_glow)" />
    <circle cx="268" cy="446" r="2" fill="#FFFFFF" />

    <!-- Sub-label -->
    <text x="250" y="470" font-family="monospace" font-size="7" font-weight="bold" fill="#606675" text-anchor="middle">• PROFILE SWITCH &amp; LED •</text>
  </g>
</svg>
