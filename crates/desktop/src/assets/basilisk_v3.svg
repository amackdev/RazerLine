    <path fill="#40D180" d="M 1295.03 859.024 C 1294.84 875.931 1294.82 892.839 1294.96 909.746 L 1295.23 911.943 C 1302.87 917.766 1453.67 948.363 1471.27 951.228 L 1474.41 952.874 C 1470.36 962.8 1420.94 1000.36 1409.57 1009.57 C 1382.63 1031.6 1356.21 1054.26 1330.34 1077.54 C 1322.73 1084.4 1301.21 1101.28 1299.48 1109.86 C 1291.69 1147.65 1281.64 1186.92 1272.79 1224.6 L 1237.97 1374.88 C 1222.97 1399.81 1205.76 1425.69 1190.02 1450.28 L 1113.19 1570.46 L 1058.2 1655.78 C 1048.08 1671.38 1035.08 1692.27 1023.97 1706.87 L 1023.72 1707.15 C 1019.79 1705.77 988.339 1655.92 983.803 1648.95 C 942.556 1585.42 901.63 1521.68 861.029 1457.74 C 843.594 1430.91 826.34 1403.97 809.267 1376.91 C 808.428 1374.86 805.847 1360.93 805.234 1357.99 C 802.312 1343.96 799.275 1329.95 796.123 1315.96 L 763.253 1172.81 C 760.64 1161.47 749.535 1116.35 749.283 1106.93 C 746.978 1102.99 715.377 1076.16 709.306 1070.85 L 624.232 996.582 C 607.459 982.079 589.282 967.129 572.968 952.354 C 587.614 949.315 602.29 946.454 617.007 943.296 C 649.442 936.431 681.795 929.184 714.059 921.557 C 720.163 920.163 749.89 914.495 752.759 911.826 C 753.807 901.509 752.196 870.255 751.551 858.737 C 812.913 901.722 872.532 948.249 933.798 991.608 C 936.849 993.418 938.345 993.42 939.21 996.904 C 939.755 999.098 938.167 1006.98 937.409 1008.68 C 935.316 1028.45 931.624 1048.69 928.665 1068.42 C 927.862 1073.78 924.977 1093.65 923.457 1097.99 L 1022.71 1404.11 L 1024.14 1406.54 L 1025.54 1406.44 L 1026.49 1404.69 C 1035.67 1378.41 1043.63 1349.96 1051.98 1323.29 L 1089.9 1205.75 L 1113.22 1134.9 C 1116.02 1126.43 1123.53 1105.32 1124.8 1097.4 C 1120.75 1067.04 1113.79 1031.85 1108.49 1001.21 L 1107.49 996.777 C 1109.13 993.181 1108.98 994.159 1113.12 991.698 C 1174.14 948.004 1234.78 903.778 1295.03 859.024 z" />
    <path fill="#40D180" d="M 1023.94 299.195 C 1026.04 299.778 1025.44 299.181 1026.21 300.31 C 1078.67 333.058 1132.55 369.142 1184.32 403.219 L 1238.71 438.996 C 1246.97 444.418 1258.91 451.583 1266.48 457.295 C 1258.63 480.716 1246.47 511.533 1237.33 535.058 C 1234.28 542.917 1213.9 558.399 1208.2 565.349 C 1183.53 590.578 1156.43 616.763 1133.25 643.204 C 1125.56 651.968 1119.26 677.486 1112.73 688.073 C 1104.55 706.859 1093.69 727.665 1086.66 746.456 C 1103.82 732.81 1126.47 713.61 1142.56 698.494 C 1147.63 695.003 1165.8 680.794 1169.49 676.627 C 1177.26 669.963 1185.55 663.582 1191.43 654.896 C 1201.57 639.903 1203.7 611.369 1213.05 597.001 C 1230.6 570.035 1248.21 542.321 1265.15 514.996 C 1264.93 560.593 1260.49 619.746 1257.89 666.362 L 1204.59 715.436 C 1200.22 719.451 1182.95 734.79 1179.75 739.047 C 1158.55 757.676 1137.86 776.877 1117.7 796.629 C 1109.24 802.999 1030.89 818.672 1018 816.921 C 1003.81 814.991 941.197 803.185 930.041 797.172 C 927.458 792.351 874.868 744.72 868.216 739.31 C 855.82 727.279 842.404 715.452 829.634 703.706 C 816.377 691.509 802.594 678.103 788.802 666.655 C 786.077 616.665 783.417 562.434 779.517 512.761 C 794.699 542.069 815.479 566.516 832.934 593.839 C 842.791 609.268 845.794 640.433 856.614 656.483 C 860.28 661.921 872.11 671.258 877.266 675.815 C 876.632 657.735 876.054 651.097 877.005 631.985 C 903.118 657.928 902.504 663.646 907.144 700.225 C 915.29 709.331 949.92 737.167 960.768 746.263 C 954.188 729.036 944.467 709.345 936.815 692.105 C 929.718 680.305 922.565 651.947 914.113 642.781 C 889.773 616.387 862.374 589.551 837.148 563.837 C 831.817 558.403 813.424 542.544 810.979 537.489 C 798.852 512.41 788.613 485.182 779.12 459.041 C 854.804 411.029 928.95 359.875 1004.45 311.474 C 1010.99 307.281 1017.12 302.96 1023.94 299.195 z" />
    <path fill="#40D180" d="M 373.13 552.758 C 448.979 540.461 523.74 526.139 600.068 514.261 C 587.47 521.889 574.5 530.555 562.078 538.583 C 587.42 548.425 629.261 557.845 657.323 567.062 C 663.563 568.463 671.008 570.341 677.198 571.44 C 685.94 618.122 702.074 669.091 712.264 715.814 C 715.179 729.179 722.589 752.911 723.34 766.012 C 733.652 797.325 743.317 826.605 751.551 858.737 C 752.196 870.255 753.807 901.509 752.759 911.826 C 749.89 914.495 720.163 920.163 714.059 921.557 C 681.795 929.184 649.442 936.431 617.007 943.296 C 602.29 946.454 587.614 949.315 572.968 952.354 C 573.488 904.083 567.22 853.122 566.875 805.27 C 565.105 791.285 565.201 764.478 564.818 749.523 C 534.84 764.437 504.969 781.543 474.471 795.888 C 465.044 800.322 454.476 806.424 445.208 810.489 C 420.301 851.018 394.058 890.435 369.76 931.268 L 353.487 930.965 C 355.581 962.215 368.264 1015.42 374.088 1048.56 C 361.372 1019.7 347.32 993.425 337.018 963.441 C 324.495 982.355 314.448 1011.3 302.749 1031.52 C 311.62 992.133 317.823 954.466 330.773 915.974 C 339.485 890.081 332.73 888.768 355.969 869.774 C 356.424 885.315 354.438 899.467 354.072 915.072 C 356.713 911.012 366.543 897.616 367.452 894.792 C 371.099 883.457 372.636 867.374 374.626 855.2 C 378.545 830.882 382.842 806.627 387.517 782.443 C 394.32 776.349 412.274 764.309 419.974 759.041 C 442.067 744.047 464.269 729.215 486.577 714.543 C 464.961 718.322 435.278 726.173 413.219 731.118 C 366.247 741.634 319.197 751.797 272.072 761.608 C 283.459 792.217 300.65 833.167 314.211 863.023 C 273.91 821.962 232.729 774.495 192.714 731.802 C 251.971 671.239 312.116 611.551 373.13 552.758 z" />
  </g>
</svg>
