<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <!-- 11-Zone Underglow Halo Filter / Gradients -->
    <radialGradient id="desk_glow" cx="50%" cy="58%" r="48%" fx="50%" fy="58%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#26AA5C" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#145A32" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Multi-Zone Rainbow / Chroma Underglow Edge Gradient -->
    <linearGradient id="underglow_spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.85" />
      <stop offset="20%" stop-color="#FF9900" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FFFF00" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#0099FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CC00FF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Shell Shading Gradients -->
    <linearGradient id="palm_body" x1="20%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#282a30" />
      <stop offset="50%" stop-color="#1b1c20" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <linearGradient id="click_left" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#343740" />
      <stop offset="40%" stop-color="#222429" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>

    <linearGradient id="click_right" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#32353c" />
      <stop offset="45%" stop-color="#202227" />
      <stop offset="100%" stop-color="#131417" />
    </linearGradient>

    <linearGradient id="thumb_wing_grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="50%" stop-color="#1e2025" />
      <stop offset="100%" stop-color="#2a2d34" />
    </linearGradient>

    <linearGradient id="wheel_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#202226" />
      <stop offset="75%" stop-color="#202226" />
      <stop offset="100%" stop-color="#40D180" stop-opacity="0.95" />
    </linearGradient>

    <!-- Textured Knurled Grip Pattern -->
    <pattern id="knurled_grip" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0,3 L3,0 L6,3 L3,6 Z" fill="#18191d" stroke="#2a2c33" stroke-width="0.75" />
    </pattern>

    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Ambient Desk Reflection Underglow Halo (11-Zone Chroma) -->
  <ellipse cx="250" cy="385" rx="195" ry="245" fill="url(#desk_glow)" />

  <!-- 2. Braided Speedflex Cable (Top Center) -->
  <g id="cable_assembly">
    <!-- Cable Cord -->
    <path d="M 244,0 L 244,55 L 256,55 L 256,0 Z" fill="#151619" stroke="#25272e" stroke-width="1" />
    <path d="M 244,8 L 256,14 M 244,18 L 256,24 M 244,28 L 256,34 M 244,38 L 256,44 M 244,48 L 256,54" stroke="#3b3f49" stroke-width="1.2" />
    <!-- Molded Strain Relief Boot with Ribs -->
    <path d="M 238,55 L 238,82 L 262,82 L 262,55 Z" fill="#1a1b1f" stroke="#0a0a0c" stroke-width="1.5" />
    <line x1="238" y1="62" x2="262" y2="62" stroke="#0e0f12" stroke-width="2" />
    <line x1="238" y1="69" x2="262" y2="69" stroke="#0e0f12" stroke-width="2" />
    <line x1="238" y1="76" x2="262" y2="76" stroke="#0e0f12" stroke-width="2" />
  </g>

  <!-- 3. Foundation Base & 11-Zone Chroma Underglow Rim -->
  <g id="underglow_base">
    <path d="M 175,95 
             L 235,125 
             L 265,125 
             L 325,110 
             L 355,160 
             L 365,245 
             L 362,350 
             L 350,470 
             L 310,550 
             L 250,572 
             L 190,550 
             L 155,475 
             L 125,410 
             L 115,335 
             L 138,240 
             L 155,165 Z" 
          fill="#0c0d10" 
          stroke="url(#underglow_spectrum)" 
          stroke-width="4.5" 
          stroke-linejoin="round" />
  </g>

  <!-- 4. Left Flank: Signature Basilisk Thumb Rest Wing with Textured Knurled Grip -->
  <g id="thumb_wing_assembly">
    <!-- Wing Ergonomic Flaired Base -->
    <path d="M 160,205 
             L 138,240 
             L 115,335 
             L 125,410 
             L 155,475 
             L 175,465 
             L 165,370 
             L 168,270 Z" 
          fill="url(#thumb_wing_grad)" 
          stroke="#16171b" 
          stroke-width="1.5" />
    
    <!-- Rubber Textured Mesh Overlay -->
    <path d="M 156,215 
             L 137,245 
             L 118,335 
             L 127,405 
             L 152,465 
             L 166,455 
             L 158,370 
             L 162,270 Z" 
          fill="url(#knurled_grip)" 
          opacity="0.9" />

    <!-- Multi-Function Sniper Clutch Paddle (Front of Thumb Wing) -->
    <g id="sniper_clutch_paddle">
      <path d="M 148,255 L 138,260 L 136,290 L 148,285 Z" fill="#2d3038" stroke="#484d5a" stroke-width="1.2" rx="2" />
      <line x1="141" y1="268" x2="145" y2="267" stroke="#686f80" stroke-width="1.5" />
      <line x1="141" y1="274" x2="145" y2="273" stroke="#686f80" stroke-width="1.5" />
      <line x1="141" y1="280" x2="145" y2="279" stroke="#686f80" stroke-width="1.5" />
    </g>

    <!-- Side Buttons (M5 Forward & M4 Back) above thumb rest -->
    <g id="side_buttons_m4_m5">
      <!-- M5 Forward Button -->
      <path d="M 157,208 L 164,204 L 166,245 L 158,243 Z" fill="#282a31" stroke="#3d414c" stroke-width="1.2" />
      <!-- M4 Back Button -->
      <path d="M 158,248 L 166,250 L 168,295 L 159,292 Z" fill="#282a31" stroke="#3d414c" stroke-width="1.2" />
      <!-- Glossy divider channel behind side buttons -->
      <path d="M 166,200 L 170,305" stroke="#0e0f12" stroke-width="2.5" />
    </g>
  </g>

  <!-- 5. Right Flank: Sculpted Rubber Grip Panel -->
  <g id="right_grip_assembly">
    <path d="M 335,190 
             L 355,235 
             L 358,330 
             L 348,430 
             L 332,475 
             L 326,450 
             L 338,360 
             L 336,260 
             L 325,205 Z" 
          fill="#1c1d22" 
          stroke="#121316" 
          stroke-width="1.5" />
    <path d="M 333,195 
             L 352,238 
             L 355,330 
             L 345,425 
             L 330,465 
             L 328,445 
             L 336,360 
             L 333,260 
             L 324,208 Z" 
          fill="url(#knurled_grip)" 
          opacity="0.9" />
  </g>

  <!-- 6. Main Palm Shell & Ergonomic Contours -->
  <g id="main_palm_body">
    <path d="M 175,320 
             L 242,260 
             L 325,260 
             L 335,370 
             L 326,480 
             L 295,548 
             L 250,565 
             L 205,548 
             L 174,480 
             L 165,370 Z" 
          fill="url(#palm_body)" 
          stroke="#2d3038" 
          stroke-width="1.5" />

    <!-- Piano-Black Gloss Accent Diagonal Slash -->
    <path d="M 172,316 L 244,258 L 244,264 L 175,324 Z" fill="#0c0d10" stroke="#3a3e48" stroke-width="0.8" />
  </g>

  <!-- 7. Sculpted Left Click Trigger (Signature Flared Tip) -->
  <g id="left_click_trigger">
    <path d="M 175,95 
             L 235,125 
             L 236,258 
             L 172,316 
             L 160,205 
             L 155,165 Z" 
          fill="url(#click_left)" 
          stroke="#383c46" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
    <!-- Finger Ergonomic Well Shadow -->
    <path d="M 180,120 Q 205,170 205,245" stroke="#101114" stroke-width="2.5" fill="none" opacity="0.6" />
  </g>

  <!-- 8. Sculpted Right Click Trigger (Flared Tip) -->
  <g id="right_click_trigger">
    <path d="M 264,125 
             L 325,110 
             L 355,160 
             L 345,210 
             L 326,260 
             L 264,260 Z" 
          fill="url(#click_right)" 
          stroke="#383c46" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
    <!-- Finger Ergonomic Well Shadow -->
    <path d="M 315,135 Q 295,180 295,245" stroke="#101114" stroke-width="2.5" fill="none" opacity="0.6" />
  </g>

  <!-- 9. Center Wheel Bay & Recessed Controls -->
  <g id="center_controls_bay">
    <!-- Wheel Bay Recess -->
    <rect x="236" y="120" width="28" height="142" rx="3" fill="#0d0e11" stroke="#25272e" stroke-width="1.2" />

    <!-- HyperScroll Tilt Wheel with Chroma LED Side Rims -->
    <g id="hyperscroll_wheel">
      <!-- Wheel Outer Glow -->
      <rect x="238" y="132" width="24" height="66" rx="4" fill="url(#wheel_glow)" stroke="#40D180" stroke-width="1.2" filter="url(#soft_glow)" />
      <!-- Wheel Center Tread Core -->
      <rect x="242" y="132" width="16" height="66" rx="2" fill="#141518" stroke="#282a30" stroke-width="1" />
      <!-- Metal Serrated Ribs on Tread -->
      <line x1="242" y1="140" x2="258" y2="140" stroke="#484d5a" stroke-width="1.5" />
      <line x1="242" y1="148" x2="258" y2="148" stroke="#484d5a" stroke-width="1.5" />
      <line x1="242" y1="156" x2="258" y2="156" stroke="#484d5a" stroke-width="1.5" />
      <line x1="242" y1="164" x2="258" y2="164" stroke="#484d5a" stroke-width="1.5" />
      <line x1="242" y1="172" x2="258" y2="172" stroke="#484d5a" stroke-width="1.5" />
      <line x1="242" y1="180" x2="258" y2="180" stroke="#484d5a" stroke-width="1.5" />
      <line x1="242" y1="188" x2="258" y2="188" stroke="#484d5a" stroke-width="1.5" />
    </g>

    <!-- Tilt Direction Arrow Indicators (< and >) -->
    <text x="230" y="169" font-family="monospace" font-size="12" font-weight="bold" fill="#6a7080" text-anchor="middle">&lt;</text>
    <text x="270" y="169" font-family="monospace" font-size="12" font-weight="bold" fill="#6a7080" text-anchor="middle">&gt;</text>

    <!-- Scroll Mode Toggle Button (Free-Spin / Tactile) -->
    <g id="button_scroll_mode">
      <rect x="242" y="206" width="16" height="19" rx="3" fill="#24262d" stroke="#424652" stroke-width="1" />
      <rect x="246" y="210" width="8" height="11" rx="1.5" fill="#151619" />
    </g>

    <!-- DPI Stage Cycle Button -->
    <g id="button_dpi_cycle">
      <rect x="242" y="232" width="16" height="19" rx="3" fill="#24262d" stroke="#424652" stroke-width="1" />
      <circle cx="250" cy="241" r="3" fill="#40D180" />
    </g>
  </g>

  <!-- 10. Backlit Razer Tri-Snake Chroma Palm Logo -->
