      <path fill="#40D180" d="M 373.13 552.758 C 448.979 540.461 523.74 526.139 600.068 514.261 C 587.47 521.889 574.5 530.555 562.078 538.583 C 587.42 548.425 629.261 557.845 657.323 567.062 C 663.563 568.463 671.008 570.341 677.198 571.44 C 685.94 618.122 702.074 669.091 712.264 715.814 C 715.179 729.179 722.589 752.911 723.34 766.012 C 733.652 797.325 743.317 826.605 751.551 858.737 C 752.196 870.255 753.807 901.509 752.759 911.826 C 749.89 914.495 720.163 920.163 714.059 921.557 C 681.795 929.184 649.442 936.431 617.007 943.296 C 602.29 946.454 587.614 949.315 572.968 952.354 C 573.488 904.083 567.22 853.122 566.875 805.27 C 565.105 791.285 565.201 764.478 564.818 749.523 C 534.84 764.437 504.969 781.543 474.471 795.888 C 465.044 800.322 454.476 806.424 445.208 810.489 C 420.301 851.018 394.058 890.435 369.76 931.268 L 353.487 930.965 C 355.581 962.215 368.264 1015.42 374.088 1048.56 C 361.372 1019.7 347.32 993.425 337.018 963.441 C 324.495 982.355 314.448 1011.3 302.749 1031.52 C 311.62 992.133 317.823 954.466 330.773 915.974 C 339.485 890.081 332.73 888.768 355.969 869.774 C 356.424 885.315 354.438 899.467 354.072 915.072 C 356.713 911.012 366.543 897.616 367.452 894.792 C 371.099 883.457 372.636 867.374 374.626 855.2 C 378.545 830.882 382.842 806.627 387.517 782.443 C 394.32 776.349 412.274 764.309 419.974 759.041 C 442.067 744.047 464.269 729.215 486.577 714.543 C 464.961 718.322 435.278 726.173 413.219 731.118 C 366.247 741.634 319.197 751.797 272.072 761.608 C 283.459 792.217 300.65 833.167 314.211 863.023 C 273.91 821.962 232.729 774.495 192.714 731.802 C 251.971 671.239 312.116 611.551 373.13 552.758 z" />
    </g>
  </g>
</svg>
