<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <!-- Ambient Chroma Desk Reflection -->
    <radialGradient id="vu_desk_glow" cx="50%" cy="55%" r="46%" fx="50%" fy="55%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#26AA5C" stop-opacity="0.14" />
      <stop offset="80%" stop-color="#0D3318" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Shell Body Gradients -->
    <linearGradient id="vu_body" x1="20%" y1="15%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2a2c32" />
      <stop offset="50%" stop-color="#1a1b1f" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <linearGradient id="vu_click_left" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#34373f" />
      <stop offset="40%" stop-color="#232529" />
      <stop offset="100%" stop-color="#151618" />
    </linearGradient>

    <linearGradient id="vu_click_right" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#32353c" />
      <stop offset="45%" stop-color="#212328" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>

    <!-- Side Grip Texture -->
    <linearGradient id="vu_side_grip" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="50%" stop-color="#1e2025" />
      <stop offset="100%" stop-color="#28292f" />
    </linearGradient>

    <!-- Textured Grip Pattern -->
    <pattern id="vu_grip_tex" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0,2.5 L2.5,0 L5,2.5 L2.5,5 Z" fill="#18191d" stroke="#2a2c33" stroke-width="0.6" />
    </pattern>

    <!-- Chroma Logo Glow -->
    <radialGradient id="vu_logo_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#26AA5C" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="vu_soft_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Underglow Spectrum -->
    <linearGradient id="vu_underglow_spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#FF9900" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFF00" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#0099FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#CC00FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Wheel gradient -->
    <linearGradient id="vu_wheel_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#202226" />
      <stop offset="70%" stop-color="#202226" />
      <stop offset="100%" stop-color="#40D180" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- 1. Ambient Desk Chroma Underglow Halo -->
  <ellipse cx="250" cy="375" rx="185" ry="235" fill="url(#vu_desk_glow)" />

  <!-- 2. Razer Speedflex / Wireless — no cable on wireless model, thin charge cable on wired -->
  <g id="vu_cable">
    <path d="M 244,0 L 244,62 L 256,62 L 256,0 Z" fill="#151619" stroke="#25272e" stroke-width="1" />
    <path d="M 244,10 L 256,16 M 244,22 L 256,28 M 244,34 L 256,40 M 244,46 L 256,52" stroke="#3b3f49" stroke-width="1" />
    <!-- Strain Relief -->
    <path d="M 240,62 L 240,84 L 260,84 L 260,62 Z" fill="#1a1b1f" stroke="#0a0a0c" stroke-width="1.5" />
    <line x1="240" y1="69" x2="260" y2="69" stroke="#0e0f12" stroke-width="1.8" />
    <line x1="240" y1="76" x2="260" y2="76" stroke="#0e0f12" stroke-width="1.8" />
  </g>

  <!-- 3. Outer Shell Silhouette — Ambidextrous Symmetrical Shape -->
  <g id="vu_shell_outline">
    <path d="M 200,90
             L 240,105
             L 260,105
             L 300,90
             L 335,140
             L 345,220
             L 342,320
             L 335,420
             L 315,500
             L 280,545
             L 250,555
             L 220,545
             L 185,500
             L 165,420
             L 158,320
             L 155,220
             L 165,140 Z"
          fill="#0c0d10"
          stroke="url(#vu_underglow_spectrum)"
          stroke-width="4"
          stroke-linejoin="round" />
  </g>

  <!-- 4. Left Side Grip Panel (Ambidextrous — both sides have grips) -->
  <g id="vu_left_grip">
    <path d="M 165,175
             L 155,220
             L 158,320
             L 165,420
             L 178,440
             L 175,320
             L 170,220
             L 175,180 Z"
          fill="url(#vu_side_grip)"
          stroke="#16171b"
          stroke-width="1.2" />
    <path d="M 163,180
             L 155,222
             L 158,318
             L 164,416
             L 175,435
             L 173,318
             L 168,222
             L 173,185 Z"
          fill="url(#vu_grip_tex)"
          opacity="0.85" />

    <!-- Left Side Buttons (M5/M4) -->
    <g id="vu_side_btns_left">
      <!-- M5 Forward -->
      <path d="M 170,228 L 178,224 L 180,262 L 172,260 Z" fill="#282a31" stroke="#3d414c" stroke-width="1.1" />
      <!-- M4 Back -->
      <path d="M 172,268 L 180,266 L 182,308 L 174,306 Z" fill="#282a31" stroke="#3d414c" stroke-width="1.1" />
      <!-- Divider -->
      <path d="M 180,220 L 183,315" stroke="#0e0f12" stroke-width="2" />
    </g>
  </g>

  <!-- 5. Right Side Grip Panel (Symmetrical) -->
  <g id="vu_right_grip">
    <path d="M 335,175
             L 345,220
             L 342,320
             L 335,420
             L 322,440
             L 325,320
             L 330,220
             L 325,180 Z"
          fill="url(#vu_side_grip)"
          stroke="#16171b"
          stroke-width="1.2" />
    <path d="M 337,180
             L 345,222
             L 342,318
             L 336,416
             L 325,435
             L 327,318
             L 332,222
             L 327,185 Z"
          fill="url(#vu_grip_tex)"
          opacity="0.85" />

    <!-- Right Side Buttons (symmetrical, for lefties) -->
    <g id="vu_side_btns_right">
      <path d="M 330,228 L 322,224 L 320,262 L 328,260 Z" fill="#282a31" stroke="#3d414c" stroke-width="1.1" />
      <path d="M 328,268 L 320,266 L 318,308 L 326,306 Z" fill="#282a31" stroke="#3d414c" stroke-width="1.1" />
      <path d="M 320,220 L 317,315" stroke="#0e0f12" stroke-width="2" />
    </g>
  </g>

  <!-- 6. Main Body / Palm Shell -->
  <g id="vu_palm_body">
    <path d="M 185,290
             L 240,240
             L 260,240
             L 315,290
             L 330,390
             L 318,490
             L 280,540
             L 250,548
             L 220,540
             L 182,490
             L 170,390 Z"
          fill="url(#vu_body)"
          stroke="#2d3038"
          stroke-width="1.2" />
  </g>

  <!-- 7. Left Click Trigger -->
  <g id="vu_left_click">
    <path d="M 200,90
             L 240,105
             L 244,240
             L 185,290
             L 175,200
             L 165,140 Z"
          fill="url(#vu_click_left)"
          stroke="#383c46"
          stroke-width="1.3"
          stroke-linejoin="round" />
    <!-- Finger well shadow -->
    <path d="M 205,110 Q 215,165 215,235" stroke="#101114" stroke-width="2" fill="none" opacity="0.55" />
  </g>

  <!-- 8. Right Click Trigger -->
  <g id="vu_right_click">
    <path d="M 260,105
             L 300,90
             L 335,140
             L 325,200
             L 315,290
             L 256,240
             L 256,105 Z"
          fill="url(#vu_click_right)"
          stroke="#383c46"
          stroke-width="1.3"
          stroke-linejoin="round" />
    <!-- Finger well shadow -->
    <path d="M 295,110 Q 285,165 285,235" stroke="#101114" stroke-width="2" fill="none" opacity="0.55" />
  </g>

  <!-- 9. Center Wheel Bay -->
  <g id="vu_wheel_bay">
    <!-- Bay recess -->
    <rect x="240" y="102" width="20" height="140" rx="3" fill="#0d0e11" stroke="#25272e" stroke-width="1" />

    <!-- Scroll Wheel -->
    <g id="vu_scroll_wheel">
      <rect x="241" y="114" width="18" height="55" rx="3.5" fill="url(#vu_wheel_glow)" stroke="#40D180" stroke-width="0.8" filter="url(#vu_soft_glow)" />
      <!-- Wheel tread ribs -->
      <rect x="244" y="114" width="12" height="55" rx="2" fill="#141518" stroke="#282a30" stroke-width="0.8" />
      <line x1="244" y1="122" x2="256" y2="122" stroke="#484d5a" stroke-width="1.2" />
      <line x1="244" y1="129" x2="256" y2="129" stroke="#484d5a" stroke-width="1.2" />
      <line x1="244" y1="136" x2="256" y2="136" stroke="#484d5a" stroke-width="1.2" />
      <line x1="244" y1="143" x2="256" y2="143" stroke="#484d5a" stroke-width="1.2" />
      <line x1="244" y1="150" x2="256" y2="150" stroke="#484d5a" stroke-width="1.2" />
      <line x1="244" y1="157" x2="256" y2="157" stroke="#484d5a" stroke-width="1.2" />
      <line x1="244" y1="164" x2="256" y2="164" stroke="#484d5a" stroke-width="1.2" />
    </g>

    <!-- DPI Cycle Button -->
    <g id="vu_dpi_btn">
      <rect x="244" y="178" width="12" height="16" rx="2.5" fill="#24262d" stroke="#424652" stroke-width="1" />
      <circle cx="250" cy="186" r="2.5" fill="#40D180" />
    </g>
  </g>

  <!-- 10. Backlit Razer Logo (Chroma Zone) -->
  <g id="vu_logo_zone">
    <circle cx="250" cy="410" r="22" fill="url(#vu_logo_glow)" opacity="0.4" />
