[package]
name = "razer-hid-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RazerLine — graphical control panel for Razer HID peripherals"

[[bin]]
name = "razerline"
path = "src/main.rs"

[dependencies]
razer-hid-abi = { path = "../abi" }
razer-hid-client = { path = "../client" }
eframe = "0.28"
egui_extras = { version = "0.28", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.26.1"
muda = "0.21.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# tray-icon's Linux/BSD backend is built on GTK 3 + AppIndicator and needs
# `gtk::init()` called (and a GLib main loop pumping) before it can build a
# menu — see `main.rs`'s `init_gtk_main_loop`. Not needed on Windows, where
# tray-icon uses native win32 APIs directly.
[target.'cfg(not(windows))'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
