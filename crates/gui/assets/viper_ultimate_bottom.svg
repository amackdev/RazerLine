<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <!-- Ambient Desk Glow -->
    <radialGradient id="vu_desk_glow_btm" cx="50%" cy="52%" r="46%" fx="50%" fy="52%">
      <stop offset="0%" stop-color="#40D180" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#1E8449" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Underglow Rim Spectrum -->
    <linearGradient id="vu_rim_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.85" />
      <stop offset="20%" stop-color="#FF9900" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FFFF00" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#0099FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CC00FF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Base Plate -->
    <linearGradient id="vu_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22242a" />
      <stop offset="50%" stop-color="#18191e" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <!-- PTFE Glides -->
    <linearGradient id="vu_ptfe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f2f6" />
      <stop offset="60%" stop-color="#d4d8e0" />
      <stop offset="100%" stop-color="#b0b5c0" />
    </linearGradient>

    <filter id="vu_led_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Desk Chroma Underglow Reflection -->
  <ellipse cx="250" cy="355" rx="185" ry="235" fill="url(#vu_desk_glow_btm)" />

  <!-- 2. Cable / Charging Port (Top) -->
  <g id="vu_cable_btm">
    <path d="M 244,0 L 244,62 L 256,62 L 256,0 Z" fill="#151619" stroke="#282a30" stroke-width="1" />
    <path d="M 240,62 L 240,84 L 260,84 L 260,62 Z" fill="#1a1b1f" stroke="#0a0a0c" stroke-width="1.5" />
  </g>

  <!-- 3. Outer Shell with Underglow Rim (Ambidextrous Symmetric Shape) -->
  <g id="vu_outer_shell_btm">
    <path d="M 200,90
             L 240,105
             L 260,105
             L 300,90
             L 335,140
             L 345,220
             L 342,320
             L 335,420
             L 315,500
             L 280,545
             L 250,555
             L 220,545
             L 185,500
             L 165,420
             L 158,320
             L 155,220
             L 165,140 Z"
          fill="url(#vu_base)"
          stroke="url(#vu_rim_grad)"
          stroke-width="5"
          stroke-linejoin="round" />
  </g>

  <!-- 4. Inner Chassis Bevel -->
  <path d="M 205,100
           L 240,112
           L 260,112
           L 295,100
           L 328,147
           L 337,222
           L 335,318
           L 328,413
           L 310,492
           L 278,535
           L 250,544
           L 222,535
           L 190,492
           L 172,413
           L 165,318
           L 163,222
           L 172,147 Z"
        fill="#131417"
        stroke="#24262d"
        stroke-width="1.5" />

  <!-- 5. PTFE Glide Feet (100% Pure PTFE) -->
  <g id="vu_ptfe_glides">
    <!-- Top-Left Skate -->
    <path d="M 200,114 L 232,126 L 222,165 L 185,148 Z" fill="url(#vu_ptfe)" stroke="#9ea3b0" stroke-width="0.8" />
    <!-- Top-Right Skate -->
    <path d="M 300,114 L 268,126 L 278,165 L 315,148 Z" fill="url(#vu_ptfe)" stroke="#9ea3b0" stroke-width="0.8" />
    <!-- Bottom Center Arc Skate -->
    <path d="M 210,520 Q 250,542 290,520 L 295,500 Q 250,522 205,500 Z" fill="url(#vu_ptfe)" stroke="#9ea3b0" stroke-width="0.8" />
    <!-- Left Side Skate -->
    <path d="M 166,240 L 160,310 L 164,380 L 174,375 L 172,310 L 175,245 Z" fill="url(#vu_ptfe)" stroke="#9ea3b0" stroke-width="0.8" />
    <!-- Right Side Skate -->
    <path d="M 334,240 L 340,310 L 336,380 L 326,375 L 328,310 L 325,245 Z" fill="url(#vu_ptfe)" stroke="#9ea3b0" stroke-width="0.8" />
  </g>

  <!-- 6. Label & Sensor Area -->
  <g id="vu_label_area">
    <!-- Center Label Panel -->
    <path d="M 205,180 L 295,180 L 300,470 L 200,470 Z" fill="#0d0e10" stroke="#1f2127" stroke-width="1.2" />

    <!-- Header -->
    <text x="250" y="205" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7a8090" text-anchor="middle" letter-spacing="1">RAZER</text>
    <text x="250" y="224" font-family="sans-serif" font-size="14" font-weight="900" fill="#d0d5e0" text-anchor="middle" letter-spacing="1.5">VIPER ULTIMATE</text>
    <text x="250" y="238" font-family="monospace" font-size="8" fill="#505560" text-anchor="middle">20K DPI FOCUS+ OPTICAL</text>

    <!-- Barcode -->
    <line x1="210" y1="248" x2="290" y2="248" stroke="#404450" stroke-width="1" stroke-dasharray="2,1,3,1,1,2,4,2,1,3" />
    <text x="250" y="258" font-family="monospace" font-size="7" fill="#454854" text-anchor="middle">S/N: RZ01-0390</text>

    <!-- Focus+ 20K Optical Sensor -->
    <g id="vu_sensor">
      <ellipse cx="250" cy="325" rx="20" ry="28" fill="url(#vu_ptfe)" stroke="#808696" stroke-width="1" />
      <ellipse cx="250" cy="325" rx="12" ry="19" fill="#050507" stroke="#25272e" stroke-width="1.2" />
      <rect x="246" y="318" width="8" height="14" rx="2" fill="#111216" stroke="#40D180" stroke-width="0.8" />
      <circle cx="250" cy="325" r="2.5" fill="#FF2222" opacity="0.85" filter="url(#vu_led_glow)" />
    </g>

    <!-- Certification -->
    <text x="215" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a3d46">CE</text>
    <text x="285" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a3d46">FC</text>
    <text x="250" y="400" font-family="monospace" font-size="7" fill="#404450" text-anchor="middle">MODEL NO: RZ01-0390</text>
    <text x="250" y="410" font-family="monospace" font-size="7" fill="#404450" text-anchor="middle">5V ⎓ 300mA • MADE IN CHINA</text>
  </g>

  <!-- 7. Profile Switch Button & Indicator LED -->
  <g id="vu_profile_switch">
    <!-- Recessed Frame -->
    <rect x="220" y="428" width="60" height="26" rx="5" fill="#16181d" stroke="#2e323c" stroke-width="1.2" />
    <!-- Button Plunger -->
    <rect x="223" y="431" width="34" height="20" rx="3.5" fill="#252830" stroke="#454b58" stroke-width="1" />
    <text x="240" y="444" font-family="sans-serif" font-size="8" font-weight="bold" fill="#a0a6b5" text-anchor="middle">PROFILE</text>
    <!-- Profile Indicator LED -->
    <circle cx="268" cy="441" r="4.5" fill="#40D180" stroke="#80FFB0" stroke-width="1" filter="url(#vu_led_glow)" />
    <circle cx="268" cy="441" r="2" fill="#FFFFFF" />
    <!-- Sub-label -->
    <text x="250" y="464" font-family="monospace" font-size="7" font-weight="bold" fill="#606675" text-anchor="middle">• PROFILE SWITCH &amp; LED •</text>
  </g>
</svg>
