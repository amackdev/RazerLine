[package]
name = "razer-hid-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Loads razer-hid-core/-devices-mice as DLLs at runtime and exposes an ergonomic RazerDevice API over them"

[dependencies]
razer-hid-abi = { path = "../abi" }
razer-hid-core = { path = "../core", optional = true }
razer-hid-devices-mice = { path = "../devices-mice", optional = true }
libloading.workspace = true
thiserror.workspace = true

[features]
default = ["builtin"]
builtin = ["dep:razer-hid-core", "dep:razer-hid-devices-mice"]
