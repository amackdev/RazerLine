name: Release

# Builds and attaches Windows binaries and MSI installer to a GitHub Release whenever a
# version tag (v1.2.3) is pushed.

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Workspace
        run: cargo build --workspace --release

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build MSI Installer
        shell: pwsh
        run: .\installer\build-installer.ps1 -SkipBuild

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $stage = "razerline-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/release/razerline.exe" $stage/
          Copy-Item "target/release/razer_hid_core.dll" $stage/
          Copy-Item "target/release/razer_hid_devices_mice.dll" $stage/
          Copy-Item README.md, LICENSE $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          echo "ZIP_ASSET=$stage.zip" >> $env:GITHUB_ENV
          echo "MSI_ASSET=installer/output/RazerLine-0.1.0-x64.msi" >> $env:GITHUB_ENV

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.MSI_ASSET }}
            ${{ env.ZIP_ASSET }}
